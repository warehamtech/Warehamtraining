<!doctype html>
<html lang="en-ZA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Create an account — WHA Learning Portal</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/brand/wha-logo.png">
<link rel="stylesheet" href="/assets/css/tokens.css">
<link rel="stylesheet" href="/assets/css/base.css">
<link rel="stylesheet" href="/assets/css/components.css">
<link rel="stylesheet" href="/assets/css/layout.css">
<script defer src="/assets/vendor/supabase.js"></script>
<script type="module" src="/assets/js/pages/register.js"></script>
<script type="module" src="/assets/js/router.js"></script>
</head>
<body>
<a class="skip-link" href="#app">Skip to content</a>
<header id="site-header"></header>

<main id="app" class="shell auth-page">
  <div class="auth-card">
    <div class="center">
      <a href="/" aria-label="Wareham &amp; Associates home">
        <img src="/assets/brand/wha-logo.png" alt="Wareham &amp; Associates"
             width="160" height="62" style="width:160px;height:auto;margin:0 auto">
      </a>
      <h1 class="display t-2xl mt-6">Create your account</h1>
      <p class="muted t-sm mt-2">
        You will need one to enrol, track your progress and download your certificate.
      </p>
    </div>

    <section class="card mt-6">
      <div class="card__body">
        <form id="register-form" novalidate>
          <div data-message></div>

          <div class="field">
            <label class="field__label" for="name">Full name<span class="field__required">*</span></label>
            <input class="control" id="name" name="name" required autocomplete="name">
          </div>

          <div class="field">
            <label class="field__label" for="email">Email<span class="field__required">*</span></label>
            <input class="control" id="email" name="email" type="email" required
                   autocomplete="email" autocapitalize="off" spellcheck="false">
            <p class="field__hint">Your invoice and certificate are sent here.</p>
          </div>

          <div class="field">
            <label class="field__label" for="jobTitle">Job title</label>
            <input class="control" id="jobTitle" name="jobTitle" autocomplete="organization-title">
            <p class="field__hint">Optional. Printed on your certificate if given.</p>
          </div>

          <div class="field">
            <label class="field__label" for="password">Password<span class="field__required">*</span></label>
            <input class="control" id="password" name="password" type="password"
                   required autocomplete="new-password" minlength="8">
            <p class="field__hint">At least 8 characters.</p>
          </div>

          <button class="btn btn--primary btn--block" type="submit">Create account</button>
        </form>
      </div>
    </section>

    <p class="auth-foot">
      Already have an account? <a class="link" href="/login.html" id="login-link">Sign in</a>
    </p>
  </div>
</main>

<footer id="site-footer"></footer>
</body>
</html>
