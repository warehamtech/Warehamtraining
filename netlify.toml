# Netlify deployment for the WHA Learning Portal.
#
# `site/` is the finished website. Netlify serves the folder as it is on disk,
# which is also why you can open any page locally without a server, and why
# there is still no framework here to detect — decline if Netlify offers.
#
# The command below is not a build in the usual sense: nothing is compiled and
# nothing is emitted into a separate output directory. build/prerender.mjs
# rewrites a few of the committed public pages in place, filling in the
# catalogue so that the landing page, /programs and each programme carry their
# content in the HTML rather than fetching it — which is what search engines
# and link previews read. Those files are committed, so a deploy that skips
# this step still ships a complete, working site; running it here only means a
# deploy picks up catalogue changes made since the last time someone ran it.
#
# Hence `|| true`. If Supabase is unreachable, or npm has a bad day, the
# generator does nothing and the committed HTML ships exactly as it stands.
# Nothing about publishing this site should depend on a third party being up.

[build]
  publish = "site"
  command = "npm ci && node build/prerender.mjs || true"

[build.environment]
  NETLIFY_USE_YARN = "false"
  # Canonical URLs, og:url and sitemap.xml have to be absolute, and there is no
  # `location.origin` at generate time. Matches the WHA_SITE_URL secret the Edge
  # Functions read (supabase/functions/_shared/wha.ts) — set both to the real
  # domain, or generated pages will point at wha.co.za by default.
  WHA_SITE_URL = "https://wha.co.za"

# The site is a single HTML shell, site/app.html, with client-side routing
# (site/assets/js/routes.js) for everything EXCEPT three groups of routes
# that stay real, separate static files instead:
#
#  1. A handful of paths (/, /programs/index.html, /programs/{slug}.html,
#     /verify/index.html) have real SEO/link-preview/first-paint value, so
#     build/prerender.mjs still generates real static files at those exact
#     paths and they are deliberately NOT redirected here — every visitor,
#     not just crawlers, gets that file directly, with real content already
#     in the HTML rather than a blank shell waiting on JS. (An earlier
#     version of this routed real visitors to the shell too, behind a
#     User-Agent-sniffing Edge Function that let bots through to the real
#     file — measurably worse: home/catalogue/course pages went from
#     instant to a client-rendered "Loading…" for every human visitor, which
#     is what prerendering exists to avoid. Reverted; these routes are still
#     in routes.js too, so client-side navigation to them from elsewhere in
#     the app is unaffected — only the very first, direct load changed.)
#  2. /programs/program.html (the staff-only draft-preview template) has no
#     SEO value but must stay on disk — build/prerender.mjs reads it
#     directly as the template every generated programme page is spliced
#     from — so it needs `force = true` to redirect live traffic away from
#     a file that still physically exists.
#  3. Everything else collapses unconditionally: no SEO value (already
#     noindex), and nothing to lose by never having been prerendered.
#
# Order matters — first match wins, so the old-bookmark redirects and the
# force exception must precede the wildcards below them.

[[redirects]]
  from = "/admin/orders.html"
  to = "/admin/invoices.html"
  status = 301

[[redirects]]
  from = "/team/billing.html"
  to = "/invoices.html"
  status = 301

[[redirects]]
  from = "/programs/program.html"
  to = "/app.html"
  status = 200
  force = true

[[redirects]]
  from = "/login"
  to = "/app.html"
  status = 200
[[redirects]]
  from = "/login.html"
  to = "/app.html"
  status = 200
[[redirects]]
  from = "/register"
  to = "/app.html"
  status = 200
[[redirects]]
  from = "/register.html"
  to = "/app.html"
  status = 200
[[redirects]]
  from = "/dashboard"
  to = "/app.html"
  status = 200
[[redirects]]
  from = "/dashboard.html"
  to = "/app.html"
  status = 200
[[redirects]]
  from = "/certificates"
  to = "/app.html"
  status = 200
[[redirects]]
  from = "/certificates.html"
  to = "/app.html"
  status = 200
[[redirects]]
  from = "/account"
  to = "/app.html"
  status = 200
[[redirects]]
  from = "/account.html"
  to = "/app.html"
  status = 200
[[redirects]]
  from = "/checkout"
  to = "/app.html"
  status = 200
[[redirects]]
  from = "/checkout.html"
  to = "/app.html"
  status = 200
[[redirects]]
  from = "/invoices"
  to = "/app.html"
  status = 200
[[redirects]]
  from = "/invoices.html"
  to = "/app.html"
  status = 200
[[redirects]]
  from = "/invite"
  to = "/app.html"
  status = 200
[[redirects]]
  from = "/invite.html"
  to = "/app.html"
  status = 200

# Directory-level wildcards for the rest. /verify/* is deliberately absent —
# /verify/index.html is edge-function-protected (group 1 above) and
# /verify/certificate.html gets its own explicit rule so a wildcard can't
# accidentally shadow the former.
[[redirects]]
  from = "/admin/*"
  to = "/app.html"
  status = 200
[[redirects]]
  from = "/learn/*"
  to = "/app.html"
  status = 200
[[redirects]]
  from = "/team/*"
  to = "/app.html"
  status = 200
[[redirects]]
  from = "/orders/*"
  to = "/app.html"
  status = 200
[[redirects]]
  from = "/verify/certificate.html"
  to = "/app.html"
  status = 200

# Anything genuinely missing still lands on the shell — router.js resolves
# an unrecognized path to the styled not-found page — with a real 404
# status. Files that still exist on disk (group 1 above: /, /programs/*,
# /verify/index.html) are served directly by Netlify without ever reaching
# this rule.
[[redirects]]
  from = "/*"
  to = "/app.html"
  status = 404

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    # The site loads no third-party code: the Supabase library is vendored and
    # the font is self-hosted. connect-src has to allow the Supabase project
    # (PostgREST, Auth, Storage and Edge Functions all live on that origin) —
    # replace YOUR-PROJECT-REF here as well as in assets/js/env.js.
    #
    # frame-src allows the video embeds a lesson may carry. Trim it to the
    # providers you actually use.
    Content-Security-Policy = """
      default-src 'self';
      script-src 'self';
      style-src 'self' 'unsafe-inline';
      img-src 'self' data: blob:;
      font-src 'self';
      media-src 'self' blob: https://*.supabase.co;
      connect-src 'self' https://*.supabase.co wss://*.supabase.co;
      frame-src https://player.vimeo.com https://www.youtube.com https://www.youtube-nocookie.com;
      object-src 'self' blob:;
      base-uri 'self';
      form-action 'self';
      frame-ancestors 'none'
    """

# The vendored library, the font and the brand images are immutable — all
# versioned by content in spirit, and replacing any of them is a deliberate
# act rather than a routine edit.
[[headers]]
  for = "/assets/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/brand/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# CSS and JS ARE edited in place, so they can't be immutable — but
# `max-age=0, must-revalidate` was forcing a round trip to Netlify for every
# one of the ~15 shared files on every single page navigation, before the
# page could even start rendering. That's the main cause of the "lag between
# pages": nothing to do with page content, just this.
#
# `stale-while-revalidate` fixes it without giving up freshness: within the
# 5-minute max-age, repeat requests are served straight from disk with zero
# network cost — which covers the overwhelming majority of navigations within
# one browsing session. Past that, the browser serves the (possibly stale)
# cached copy INSTANTLY while it quietly re-checks in the background, so a
# navigation is never blocked waiting on a revalidation response — the
# worst case is one page seeing a version that's a few minutes old, which
# then updates itself for the next request.
#
# That reasoning still holds for stylesheets, which is why CSS keeps it: a
# stylesheet that is a few minutes old renders slightly stale paint and
# nothing worse.
[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=300, stale-while-revalidate=86400"

# JavaScript cannot have that policy, because these files are ES modules that
# import each other by name. Each URL is an independent cache entry with its
# own age and none of them are versioned or content-hashed, so a browser is
# free to pair a stale module with a fresh one. That is not hypothetical: it
# shipped. Renaming dom.js's `page` export to `runPage` meant that for the
# 24 hours of the stale-while-revalidate window, a rarely-visited page module
# could still be the pre-rename copy asking for `page`, while dom.js — which
# nearly every page imports, so it revalidates constantly — was already the
# new one that no longer exports it. The result is a module graph torn across
# two deploys and a page that dies on "does not provide an export named".
#
# So JS revalidates before use. An unchanged file still costs only a 304, and
# the reason the old policy existed has gone away in any case: the
# client-side router (assets/js/router.js) fetches each module once per tab
# and keeps it in memory, so navigations no longer refetch anything at all
# and this is paid only on a genuine page load.
[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, no-cache"
