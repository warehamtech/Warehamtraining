# Netlify deployment for the WHA Learning Portal.
#
# There is no build step: `site/` is the finished website. Netlify serves the
# folder exactly as it is on disk, which is also why you can open any page
# locally without a server.

[build]
  publish = "site"
  # No command. If Netlify offers to auto-detect a framework, decline it.
  command = ""

[build.environment]
  # Nothing to install.
  NETLIFY_USE_YARN = "false"

# Pretty URLs: /programs serves /programs/index.html, /login serves /login.html.
[[redirects]]
  from = "/login"
  to = "/login.html"
  status = 200

[[redirects]]
  from = "/register"
  to = "/register.html"
  status = 200

[[redirects]]
  from = "/dashboard"
  to = "/dashboard.html"
  status = 200

[[redirects]]
  from = "/certificates"
  to = "/certificates.html"
  status = 200

[[redirects]]
  from = "/checkout"
  to = "/checkout.html"
  status = 200

[[redirects]]
  from = "/invite"
  to = "/invite.html"
  status = 200

# Anything genuinely missing gets the styled 404 rather than Netlify's own.
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    # The site loads no third-party code: the Supabase library is vendored and
    # the font is self-hosted. connect-src has to allow the Supabase project
    # (PostgREST, Auth, Storage and Edge Functions all live on that origin) —
    # replace YOUR-PROJECT-REF here as well as in assets/js/env.js.
    #
    # frame-src allows the video embeds a lesson may carry. Trim it to the
    # providers you actually use.
    Content-Security-Policy = """
      default-src 'self';
      script-src 'self';
      style-src 'self' 'unsafe-inline';
      img-src 'self' data: blob:;
      font-src 'self';
      media-src 'self' blob: https://*.supabase.co;
      connect-src 'self' https://*.supabase.co wss://*.supabase.co;
      frame-src https://player.vimeo.com https://www.youtube.com https://www.youtube-nocookie.com;
      object-src 'self' blob:;
      base-uri 'self';
      form-action 'self';
      frame-ancestors 'none'
    """

# The vendored library, the font and the brand images are immutable — all
# versioned by content in spirit, and replacing any of them is a deliberate
# act rather than a routine edit.
[[headers]]
  for = "/assets/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/brand/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# CSS and JS ARE edited in place, so they can't be immutable — but
# `max-age=0, must-revalidate` was forcing a round trip to Netlify for every
# one of the ~15 shared files on every single page navigation, before the
# page could even start rendering. That's the main cause of the "lag between
# pages": nothing to do with page content, just this.
#
# `stale-while-revalidate` fixes it without giving up freshness: within the
# 5-minute max-age, repeat requests are served straight from disk with zero
# network cost — which covers the overwhelming majority of navigations within
# one browsing session. Past that, the browser serves the (possibly stale)
# cached copy INSTANTLY while it quietly re-checks in the background, so a
# navigation is never blocked waiting on a revalidation response — the
# worst case is one page seeing a version that's a few minutes old, which
# then updates itself for the next request.
[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=300, stale-while-revalidate=86400"

[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=300, stale-while-revalidate=86400"
